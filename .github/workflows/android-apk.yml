name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/mobile-demo-cleanup]
    paths:
      - package.json
      - package-lock.json
      - app.json
      - src/**
      - modules/**
      - assets/**
      - scripts/**
      - MOBILE_REBUILD_TODO.md
      - .github/workflows/android-apk.yml

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'pull_request' || github.head_ref != 'agent/mobile-demo-cleanup'
    name: Build native ARM64 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      EXPO_PUBLIC_BLACKBOOK_API_URL: ${{ vars.EXPO_PUBLIC_BLACKBOOK_API_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate native exchange
        run: npm run validate && npm run check:demo && npm run test:catalog && npm run test:fees && npm run test:commands && npm run test:avatar && npm run test:ui-data && node --experimental-strip-types --test scripts/quote-estimate.test.mjs scripts/isolated-liquidation.test.mjs
      - name: Check Expo dependency alignment
        run: npx expo install --check
      - name: Type-check
        run: npm run typecheck
      - name: Check auth configuration safeguards
        run: python3 -m unittest discover -s scripts -p '*_test.py'
      - name: Verify release connection
        run: npm run check:connection -- --production
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
      - name: Build stripped ARM64 release APK
        working-directory: android
        run: >-
          ./gradlew assembleRelease --no-daemon
          -PreactNativeArchitectures=arm64-v8a
          -Pandroid.enableMinifyInReleaseBuilds=true
          -Pandroid.enableShrinkResourcesInReleaseBuilds=true
      - name: Verify standalone package
        run: |
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'assets/index.android.bundle'
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'lib/arm64-v8a/'
          if unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -Eq 'lib/(x86|x86_64|armeabi-v7a)/'; then
            echo 'Unexpected non-ARM64 native libraries found.'
            exit 1
          fi
      - name: Verify embedded auth project
        run: python3 scripts/verify-apk-connection.py android/app/build/outputs/apk/release/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blackbook-mobile-arm64-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish downloadable demo APK
        if: github.event_name != 'pull_request' && github.repository == 'therealsylva/blackbook-mobile'
        run: bash .github/scripts/publish-apk.sh
