name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [feat/mobile-foundation]
    paths:
      - package.json
      - app.json
      - src/**
      - assets/**
      - scripts/**
      - .github/workflows/android-apk.yml

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build native ARM64 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate native exchange
        run: npm run validate
      - name: Check Expo dependency alignment
        run: npx expo install --check
      - name: Type-check
        run: npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
      - name: Build stripped ARM64 release APK
        working-directory: android
        run: >-
          ./gradlew assembleRelease --no-daemon
          -PreactNativeArchitectures=arm64-v8a
          -Pandroid.enableMinifyInReleaseBuilds=true
          -Pandroid.enableShrinkResourcesInReleaseBuilds=true
      - name: Verify standalone package
        run: |
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'assets/index.android.bundle'
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'lib/arm64-v8a/'
          if unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -Eq 'lib/(x86|x86_64|armeabi-v7a)/'; then
            echo 'Unexpected non-ARM64 native libraries found.'
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blackbook-mobile-arm64-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
