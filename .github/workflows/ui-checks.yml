name: Native UI checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/mobile-foundation]
    paths:
      - package.json
      - app.json
      - src/**
      - assets/**
      - scripts/**
      - .github/workflows/ui-checks.yml

concurrency:
  group: native-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate product boundary
        run: npm run validate
      - name: Check Expo dependency alignment
        run: npx expo install --check
      - name: Type-check
        run: npm run typecheck
      - name: Export web render
        run: npx expo export --platform web
      - name: Capture phone screens
        run: |
          mkdir -p ui-renders
          python3 - <<'PY' >/tmp/blackbook-ui-server.log 2>&1 &
          import os
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from urllib.parse import urlsplit

          os.chdir('dist')
          class CleanRouteHandler(SimpleHTTPRequestHandler):
              def do_GET(self):
                  route = urlsplit(self.path).path
                  if route != '/' and '.' not in route.rsplit('/', 1)[-1] and os.path.isfile('.' + route + '.html'):
                      self.path = route + '.html'
                  super().do_GET()

          ThreadingHTTPServer(('127.0.0.1', 4173), CleanRouteHandler).serve_forever()
          PY
          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:4173 >/dev/null && break
            sleep 1
          done
          BROWSER_BIN="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -n "$BROWSER_BIN"
          export BROWSER_BIN
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright
          node .github/scripts/capture-ui.mjs
      - name: Upload phone renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackbook-native-ui-${{ github.run_number }}
          path: ui-renders/*
          if-no-files-found: error
          retention-days: 7
